name: Code style
on: [push, pull_request]
permissions:
  contents: read
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv-quality
      - run: .venv-quality/bin/python -m pip install -r requirements-quality.txt
      - run: .venv-quality/bin/python tools/check_style.py
